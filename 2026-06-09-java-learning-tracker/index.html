<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Java 學習追蹤器</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #7d8590;
  --accent: #58a6ff;
  --green: #3fb950;
  --yellow: #d29922;
  --orange: #f0883e;
  --red: #f85149;
  --purple: #bc8cff;
  --pink: #ff7b72;
  --p1: #58a6ff;
  --p2: #3fb950;
  --p3: #bc8cff;
  --p4: #f0883e;
  --p5: #f85149;
  --p6: #d29922;
  --extra: #79c0ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,17,23,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 20px;
}
.header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
.header h1 span { color: var(--accent); }
.overall-progress { flex: 1; }
.progress-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
.progress-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 3px; transition: width 0.4s ease; }
.stats { display: flex; gap: 16px; font-size: 12px; }
.stat { text-align: center; }
.stat-num { font-size: 18px; font-weight: 700; color: var(--accent); }
.stat-label { color: var(--text-muted); font-size: 11px; }

/* Layout */
.layout { display: flex; min-height: calc(100vh - 65px); }

/* Sidebar */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 0;
  position: sticky; top: 65px; height: calc(100vh - 65px);
  overflow-y: auto;
}
.sidebar-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 16px 8px; }
.phase-nav { list-style: none; }
.phase-nav li { }
.phase-nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; font-size: 13px; color: var(--text-muted);
  transition: all 0.15s; border-left: 2px solid transparent;
}
.phase-nav a:hover { background: var(--surface2); color: var(--text); text-decoration: none; }
.phase-nav a.active { color: var(--text); background: var(--surface2); }
.phase-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.phase-mini-progress { margin: 0 16px 4px; height: 3px; background: var(--surface2); border-radius: 2px; }
.phase-mini-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
.sidebar-section { margin-top: 16px; }
.nav-extra-link {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; font-size: 13px; color: var(--text-muted);
  cursor: pointer; border-left: 2px solid transparent;
  transition: all 0.15s;
}
.nav-extra-link:hover { background: var(--surface2); color: var(--text); }
.nav-extra-link svg { width: 14px; height: 14px; flex-shrink: 0; }

/* Main */
.main { flex: 1; padding: 24px; max-width: 900px; }

/* Phase block */
.phase-block { margin-bottom: 48px; scroll-margin-top: 80px; }
.phase-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.phase-badge {
  padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
  background: color-mix(in srgb, var(--color) 15%, transparent);
  color: var(--color);
  border: 1px solid color-mix(in srgb, var(--color) 30%, transparent);
}
.phase-title { font-size: 20px; font-weight: 700; }
.phase-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.phase-progress-wrap { margin-left: auto; text-align: right; }
.phase-progress-text { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.phase-progress-bar { width: 100px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.phase-progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }

/* Week group */
.week-group { margin-bottom: 24px; }
.week-label {
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.week-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Day card */
.day-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 10px;
  transition: border-color 0.15s;
}
.day-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.day-card.all-done { border-color: color-mix(in srgb, var(--green) 40%, transparent); background: color-mix(in srgb, var(--green) 4%, var(--surface)); }
.day-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; cursor: pointer;
  user-select: none;
}
.day-num {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
  background: var(--surface2); color: var(--text-muted);
}
.day-card.all-done .day-num { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
.day-title { font-size: 14px; font-weight: 600; flex: 1; }
.day-tools { display: flex; gap: 4px; flex-wrap: wrap; }
.tool-tag {
  padding: 2px 8px; border-radius: 4px; font-size: 11px; font-family: 'SF Mono', monospace;
  background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border);
}
.day-check-summary { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.day-toggle { color: var(--text-muted); transition: transform 0.2s; font-size: 12px; }
.day-card.open .day-toggle { transform: rotate(180deg); }

.day-body { padding: 0 16px 14px; display: none; }
.day-card.open .day-body { display: block; }

/* Tasks */
.task-list { list-style: none; }
.task-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid var(--border);
}
.task-item:last-child { border-bottom: none; }
.task-cb { margin-top: 2px; flex-shrink: 0; }
.task-cb input[type="checkbox"] {
  width: 16px; height: 16px; cursor: pointer; accent-color: var(--green);
}
.task-text { font-size: 13px; line-height: 1.5; flex: 1; }
.task-text.done { text-decoration: line-through; color: var(--text-muted); }
.task-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.task-diff { font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }
.diff-easy { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
.diff-medium { background: color-mix(in srgb, var(--yellow) 15%, transparent); color: var(--yellow); }
.diff-hard { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }

/* Code block */
.code-block {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px; margin-top: 10px;
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
  line-height: 1.6; overflow-x: auto; color: #a5d6ff;
}
.code-block .comment { color: var(--text-muted); }
.code-block .key { color: var(--purple); }

/* Section divider in day body */
.day-section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 6px; }

/* Extra items block */
.extra-block {
  background: color-mix(in srgb, var(--extra) 5%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--extra) 25%, transparent);
  border-radius: 8px; padding: 20px; margin-bottom: 48px;
  scroll-margin-top: 80px;
}
.extra-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.extra-header h2 { font-size: 18px; font-weight: 700; color: var(--extra); }
.extra-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.6; }
.extra-group { margin-bottom: 20px; }
.extra-group-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.extra-group-title::before { content: ''; width: 3px; height: 14px; border-radius: 2px; background: var(--extra); display: block; }

/* Cheatsheet panel */
.cheatsheet {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; margin-top: 10px;
}
.cheatsheet-header {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  cursor: pointer; display: flex; justify-content: space-between;
}
.cheatsheet-body { padding: 10px 14px; display: none; }
.cheatsheet.open .cheatsheet-body { display: block; }
.shortcut-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.shortcut-table td { padding: 4px 8px; border-bottom: 1px solid var(--border); }
.shortcut-table tr:last-child td { border-bottom: none; }
.shortcut-table td:first-child { font-family: 'SF Mono', monospace; color: var(--purple); white-space: nowrap; }

/* Reset section */
.reset-bar {
  padding: 12px 24px; background: var(--surface); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; font-size: 12px;
}
.btn {
  padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text); cursor: pointer; font-size: 12px;
  transition: all 0.15s;
}
.btn:hover { background: var(--surface); border-color: var(--accent); color: var(--accent); }
.btn-danger:hover { border-color: var(--red); color: var(--red); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Responsive */
@media (max-width: 720px) {
  .sidebar { display: none; }
  .stats { display: none; }
}
</style>
</head>
<body>

<header class="header">
  <h1>Terminal <span>Java</span> 學習計畫</h1>
  <div class="overall-progress">
    <div class="progress-label">
      <span>整體進度</span>
      <span id="overall-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="overall-bar" style="width:0%"></div></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-done">0</div><div class="stat-label">已完成</div></div>
    <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">共幾項</div></div>
    <div class="stat"><div class="stat-num" id="stat-days">0</div><div class="stat-label">學習天數</div></div>
  </div>
</header>

<div class="layout">
<nav class="sidebar">
  <div class="sidebar-title">學習 Phases</div>
  <ul class="phase-nav" id="phase-nav"></ul>
  <div class="sidebar-section">
    <div class="sidebar-title">其他</div>
    <div class="nav-extra-link" onclick="scrollToExtra()">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 14.5a6.5 6.5 0 110-13 6.5 6.5 0 010 13zm.75-9.75a.75.75 0 10-1.5 0v4.5a.75.75 0 001.5 0v-4.5zm-.75 7a.875.875 0 100-1.75.875.875 0 000 1.75z"/></svg>
      額外必學項目
    </div>
  </div>
</nav>

<main class="main" id="main-content"></main>
</div>

<div class="reset-bar">
  <span style="color:var(--text-muted)">進度自動儲存在 localStorage</span>
  <button class="btn btn-danger" onclick="resetAll()">清除所有進度</button>
</div>

<script>
// ─── Data ──────────────────────────────────────────────────────────────────

const PHASES = [
  {
    id: 'p1', label: 'Phase 1', title: '地基：Shell 工具', duration: '第 1–2 週',
    color: 'var(--p1)',
    weeks: [
      {
        label: '第一週',
        days: [
          {
            day: 1, title: 'Shell 美化工具', tools: ['starship','eza','bat'],
            tasks: [
              { id: 'p1d1t1', text: '安裝 starship：brew install starship，並在 ~/.zshrc 加入 eval "$(starship init zsh)"', diff: 'easy' },
              { id: 'p1d1t2', text: '安裝 eza：brew install eza，設定 alias ll="eza -la --git"', diff: 'easy' },
              { id: 'p1d1t3', text: '安裝 bat：brew install bat，設定 alias cat="bat"', diff: 'easy' },
              { id: 'p1d1t4', text: '重啟終端，確認 starship prompt 顯示 Git branch', diff: 'easy' },
              { id: 'p1d1t5', text: '在 Java 專案執行 eza -la --git --tree --level=2，觀察結構', diff: 'easy' },
              { id: 'p1d1t6', text: '用 bat pom.xml 或 bat build.gradle 看語法高亮', diff: 'easy' },
            ],
            code: `# 驗證安裝
starship --version
eza --version
bat --version

# 看專案結構
eza -la --git --tree --level=2

# 美化 pom.xml 輸出
bat pom.xml`
          },
          {
            day: 2, title: 'fzf 模糊搜尋（基礎）', tools: ['fzf'],
            tasks: [
              { id: 'p1d2t1', text: '安裝 fzf：brew install fzf && $(brew --prefix)/opt/fzf/install', diff: 'easy' },
              { id: 'p1d2t2', text: '練習 Ctrl+R 搜尋歷史指令（搜尋你常用的 mvn 指令）', diff: 'easy' },
              { id: 'p1d2t3', text: '在 Java 專案內練習 Ctrl+T 搜尋檔案（輸入 Service）', diff: 'easy' },
              { id: 'p1d2t4', text: '設定 FZF_DEFAULT_COMMAND="fd --type f --hidden --follow --exclude .git" 讓 fzf 使用 fd 加速搜尋', diff: 'medium' },
              { id: 'p1d2t5', text: '練習 fzf 多選模式：fzf -m（按 Tab 多選多個檔案，Enter 確認）', diff: 'medium' },
              { id: 'p1d2t6', text: '在 ~/.zshrc 設定 FZF_DEFAULT_OPTS 加入 --height=40% --border --preview-window=right:50%', diff: 'easy' },
            ],
            code: `# 安裝 fzf shell 整合
$(brew --prefix)/opt/fzf/install

# 測試：按 Ctrl+R 輸入 mvn
# 測試：按 Ctrl+T 輸入 Controller

# 設定 ~/.zshrc
export FZF_DEFAULT_COMMAND="fd --type f --hidden --follow --exclude .git"
export FZF_DEFAULT_OPTS="--height=40% --border --preview-window=right:50%"
export FZF_CTRL_T_COMMAND="$FZF_DEFAULT_COMMAND"

# 多選
fzf -m   # Tab 選多個，Enter 確認`
          },
          {
            day: 3, title: 'fzf 進階組合', tools: ['fzf','bat'],
            tasks: [
              { id: 'p1d3t1', text: '練習 ls | fzf pipe 用法', diff: 'easy' },
              { id: 'p1d3t2', text: '開啟 fzf preview 模式（搭配 bat）', diff: 'medium' },
              { id: 'p1d3t3', text: '練習用 fzf 選取檔案再傳給其他指令（如 cat $(fzf)）', diff: 'medium' },
              { id: 'p1d3t4', text: '練習 Alt+C 互動式 cd 到子目錄（fzf key binding）', diff: 'medium' },
              { id: 'p1d3t5', text: '在 ~/.zshrc 建立函數 vf() { nvim $(fzf --preview "bat --color=always {}") }，用 vf 快速開啟任意檔案', diff: 'hard' },
              { id: 'p1d3t6', text: '練習 ps aux | fzf 互動式搜尋行程，找到目標後複製 PID', diff: 'easy' },
            ],
            code: `# preview 模式
fzf --preview 'bat --color=always {}'

# 用 fzf 選檔案再開啟
nvim $(fzf --preview 'bat --color=always {}')

# 搜尋並 grep
grep -r "pattern" $(fzf)`
          },
          {
            day: 4, title: 'zoxide 智慧跳轉', tools: ['zoxide'],
            tasks: [
              { id: 'p1d4t1', text: '安裝 zoxide：brew install zoxide，在 ~/.zshrc 加入 eval "$(zoxide init zsh)"', diff: 'easy' },
              { id: 'p1d4t2', text: '先用 cd 多跳幾個常用目錄，讓 zoxide 學習', diff: 'easy' },
              { id: 'p1d4t3', text: '練習 z <部分路徑> 快速跳轉（如 z java-app）', diff: 'easy' },
              { id: 'p1d4t4', text: '練習 zi 開啟互動選單', diff: 'easy' },
            ],
            code: `# 先讓 zoxide 學習你的目錄
cd ~/projects/my-java-app
cd ~/projects/backend
cd ~/Downloads

# 之後快速跳轉
z java    # → ~/projects/my-java-app
z back    # → ~/projects/backend
zi        # → 互動選單`
          },
          {
            day: 5, title: 'jenv Java 版本管理', tools: ['jenv'],
            tasks: [
              { id: 'p1d5t1', text: '確認 jenv 已安裝，執行 jenv versions 看已管理的 JDK', diff: 'easy' },
              { id: 'p1d5t2', text: '在 ~/.zshrc 確認 export plugin 和 maven plugin 已啟用', diff: 'easy' },
              { id: 'p1d5t3', text: '練習 jenv global 21 設定全域版本', diff: 'easy' },
              { id: 'p1d5t4', text: '在一個專案目錄執行 jenv local 17，確認 java -version 顯示正確', diff: 'easy' },
              { id: 'p1d5t5', text: '理解 .java-version 檔案的用途和作用範圍', diff: 'easy' },
            ],
            code: `# ~/.zshrc 必要設定
export PATH="$HOME/.jenv/bin:$PATH"
eval "$(jenv init -)"
jenv enable-plugin export
jenv enable-plugin maven

# 版本操作
jenv versions
jenv global 21
cd ~/projects/legacy && jenv local 17
java -version    # 確認切換成功
cat .java-version  # 看自動建立的檔案`
          },
          {
            day: 6, title: 'jq JSON 處理', tools: ['jq'],
            tasks: [
              { id: 'p1d6t1', text: '安裝 jq：brew install jq', diff: 'easy' },
              { id: 'p1d6t2', text: '練習 jq . 格式化 JSON（pipe 和 檔案模式）', diff: 'easy' },
              { id: 'p1d6t3', text: '練習擷取特定欄位：jq \'.name\' 和 jq \'.users[]\' ', diff: 'medium' },
              { id: 'p1d6t4', text: '練習 jq 過濾：jq \'.[] | select(.status == "active")\' ', diff: 'medium' },
              { id: 'p1d6t5', text: '練習 jq map 轉換：jq \'[.[] | {id: .id, name: .name}]\' 重新整形陣列', diff: 'medium' },
              { id: 'p1d6t6', text: '練習 jq 計算：jq \'[.[].price] | add\' 對陣列欄位求和', diff: 'hard' },
              { id: 'p1d6t7', text: '實際應用：curl localhost:8080/actuator/env | jq \'.propertySources[].properties\' 解析 Spring Boot 環境設定', diff: 'medium' },
            ],
            code: `# 基礎操作
echo '{"name":"Jason","age":30}' | jq .
echo '{"name":"Jason","age":30}' | jq '.name'
echo '{"name":"Jason","age":30}' | jq '.age'

# map 與轉換
echo '[{"id":1,"name":"Alice"},{"id":2,"name":"Bob"}]' | jq '[.[] | {id,name}]'

# 計算
echo '[{"price":10},{"price":20}]' | jq '[.[].price] | add'

# select 過濾
echo '[{"status":"active","name":"A"},{"status":"inactive","name":"B"}]' | \
  jq '.[] | select(.status == "active") | .name'

# 陣列操作
echo '[{"id":1},{"id":2}]' | jq '.[].id'

# 實際場景：格式化 API 回應
curl -s https://api.github.com/users/octocat | jq '{name: .name, repos: .public_repos}'`
          },
          {
            day: 7, title: 'httpie REST API 測試', tools: ['httpie','jq'],
            tasks: [
              { id: 'p1d7t1', text: '安裝 httpie：brew install httpie', diff: 'easy' },
              { id: 'p1d7t2', text: '啟動你的 Spring Boot 專案，用 http GET localhost:8080/actuator/health 測試', diff: 'medium' },
              { id: 'p1d7t3', text: '練習 POST 請求帶 JSON body', diff: 'medium' },
              { id: 'p1d7t4', text: '組合使用：http GET ... | jq \'.[].name\' ', diff: 'medium' },
            ],
            code: `# GET 請求
http GET localhost:8080/actuator/health
http GET localhost:8080/api/users

# POST with JSON
http POST localhost:8080/api/users name="Jason" email="jason@wtmec.com"

# 帶 header
http GET localhost:8080/api/data Authorization:"Bearer token123"

# 組合 jq
http GET localhost:8080/api/products | jq '.[].name'`
          },
        ]
      },
      {
        label: '第二週 — 複習與強化',

// ─── State ─────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'java-learning-tracker-v2';
let state = {};

function loadState() {
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { state = {}; }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function isChecked(id) { return !!state[id]; }

function toggleTask(id) {
  state[id] = !state[id];
  saveState();
  updateUI();
}

// ─── Render ────────────────────────────────────────────────────────────────

function allTaskIds() {
  const ids = [];
  PHASES.forEach(p => p.weeks.forEach(w => w.days.forEach(d => d.tasks.forEach(t => ids.push(t.id)))));
  EXTRA_ITEMS.forEach(g => g.items.forEach(t => ids.push(t.id)));
  return ids;
}

function phaseTaskIds(phase) {
  const ids = [];
  phase.weeks.forEach(w => w.days.forEach(d => d.tasks.forEach(t => ids.push(t.id))));
  return ids;
}

function countDone(ids) { return ids.filter(id => isChecked(id)).length; }

function updateUI() {
  const allIds = allTaskIds();
  const total = allIds.length;
  const done = countDone(allIds);
  const pct = total ? Math.round(done / total * 100) : 0;

  document.getElementById('overall-bar').style.width = pct + '%';
  document.getElementById('overall-pct').textContent = pct + '%';
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-total').textContent = total;

  const days = Object.values(state).filter(Boolean).length > 0
    ? [...new Set(Object.keys(state).filter(k => state[k]).map(k => k.split('t')[0]))].length
    : 0;
  document.getElementById('stat-days').textContent = days;

  PHASES.forEach(phase => {
    const ids = phaseTaskIds(phase);
    const pdone = countDone(ids);
    const ppct = ids.length ? Math.round(pdone / ids.length * 100) : 0;

    const bar = document.querySelector(`#phase-${phase.id}-bar`);
    const text = document.querySelector(`#phase-${phase.id}-text`);
    const miniBar = document.querySelector(`#nav-${phase.id}-bar`);
    if (bar) { bar.style.width = ppct + '%'; bar.style.background = phase.color; }
    if (text) text.textContent = `${pdone}/${ids.length}`;
    if (miniBar) { miniBar.style.width = ppct + '%'; miniBar.style.background = phase.color; }

    phase.weeks.forEach(week => {
      week.days.forEach(day => {
        const dayIds = day.tasks.map(t => t.id);
        const allDone = dayIds.length > 0 && dayIds.every(id => isChecked(id));
        const done = countDone(dayIds);
        const card = document.getElementById(`card-${day.tasks[0]?.id?.split('t')[0]}-${day.day}`);
        if (card) {
          card.classList.toggle('all-done', allDone);
          const summary = card.querySelector('.day-check-summary');
          if (summary) summary.textContent = `${done}/${dayIds.length}`;
        }
        day.tasks.forEach(task => {
          const label = document.getElementById(`label-${task.id}`);
          if (label) label.classList.toggle('done', isChecked(task.id));
        });
      });
    });
  });

  // Extra
  EXTRA_ITEMS.forEach(g => {
    g.items.forEach(task => {
      const label = document.getElementById(`label-${task.id}`);
      if (label) label.classList.toggle('done', isChecked(task.id));
    });
  });
}

function renderPhaseNav() {
  const nav = document.getElementById('phase-nav');
  nav.innerHTML = PHASES.map(p => `
    <li>
      <a href="#${p.id}" class="phase-link" data-phase="${p.id}">
        <span class="phase-dot" style="background:${p.color}"></span>
        ${p.label}: ${p.title}
      </a>
      <div class="phase-mini-progress">
        <div class="phase-mini-fill" id="nav-${p.id}-bar" style="width:0%"></div>
      </div>
    </li>
  `).join('');
}

function renderMain() {
  const main = document.getElementById('main-content');
  let html = '';

  PHASES.forEach(phase => {
    const ids = phaseTaskIds(phase);
    html += `
<section class="phase-block" id="${phase.id}">
  <div class="phase-header">
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <span class="phase-badge" style="--color:${phase.color}">${phase.label}</span>
        <h2 class="phase-title">${phase.title}</h2>
      </div>
      <div class="phase-subtitle">${phase.duration}・${ids.length} 項學習任務</div>
    </div>
    <div class="phase-progress-wrap">
      <div class="phase-progress-text" id="phase-${phase.id}-text">0/${ids.length}</div>
      <div class="phase-progress-bar">
        <div class="phase-progress-fill" id="phase-${phase.id}-bar" style="width:0%"></div>
      </div>
    </div>
  </div>
`;

    phase.weeks.forEach(week => {
      html += `<div class="week-group"><div class="week-label">${week.label}</div>`;
      week.days.forEach(day => {
        const cardKey = `${day.tasks[0]?.id?.split('t')[0]}-${day.day}`;
        const tools = day.tools ? day.tools.map(t => `<span class="tool-tag">${t}</span>`).join('') : '';
        html += `
<div class="day-card" id="card-${cardKey}">
  <div class="day-header" onclick="toggleCard(this)">
    <div class="day-num">D${day.day}</div>
    <div style="flex:1">
      <div class="day-title">${day.title}</div>
      <div class="day-tools">${tools}</div>
    </div>
    <div class="day-check-summary">0/${day.tasks.length}</div>
    <div class="day-toggle">▼</div>
  </div>
  <div class="day-body">
    <ul class="task-list">
      ${day.tasks.map(task => `
        <li class="task-item">
          <div class="task-cb">
            <input type="checkbox" id="cb-${task.id}" ${isChecked(task.id) ? 'checked' : ''}
              onchange="toggleTask('${task.id}')">
          </div>
          <label class="task-text ${isChecked(task.id) ? 'done' : ''}" id="label-${task.id}" for="cb-${task.id}">
            ${task.text}
            ${task.diff ? `<span class="task-diff diff-${task.diff}">${task.diff === 'easy' ? '簡單' : task.diff === 'medium' ? '中等' : '難'}</span>` : ''}
            ${task.note ? `<div class="task-note">${task.note}</div>` : ''}
          </label>
        </li>
      `).join('')}
    </ul>
    ${day.code ? `
      <div class="cheatsheet">
        <div class="cheatsheet-header" onclick="toggleCheat(this)">
          <span>練習指令參考</span><span>▶</span>
        </div>
        <div class="cheatsheet-body">
          <pre class="code-block">${day.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>
        </div>
      </div>` : ''}
  </div>
</div>`;
      });
      html += `</div>`;
    });

    html += `</section>`;
  });

  // Extra block
  html += `
<div class="extra-block" id="extra-section">
  <div class="extra-header">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="var(--extra)"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 14.5a6.5 6.5 0 110-13 6.5 6.5 0 010 13zm.75-9.75a.75.75 0 10-1.5 0v4.5a.75.75 0 001.5 0v-4.5zm-.75 7a.875.875 0 100-1.75.875.875 0 000 1.75z"/></svg>
    <h2>額外必學項目</h2>
  </div>
  <div class="extra-desc">
    以下是 roadmap 文件中沒有明確提及，但在實際工作中是前提知識的項目。
    這些不需要按順序學，缺什麼補什麼。
  </div>
  ${EXTRA_ITEMS.map(group => `
    <div class="extra-group">
      <div class="extra-group-title">${group.group}</div>
      <ul class="task-list">
        ${group.items.map(task => `
          <li class="task-item">
            <div class="task-cb">
              <input type="checkbox" id="cb-${task.id}" ${isChecked(task.id) ? 'checked' : ''}
                onchange="toggleTask('${task.id}')">
            </div>
            <label class="task-text ${isChecked(task.id) ? 'done' : ''}" id="label-${task.id}" for="cb-${task.id}">
              ${task.text}
            </label>
          </li>
        `).join('')}
      </ul>
    </div>
  `).join('')}
</div>
`;

  main.innerHTML = html;
}

// ─── Interactions ───────────────────────────────────────────────────────────

function toggleCard(header) {
  const card = header.closest('.day-card');
  card.classList.toggle('open');
}

function toggleCheat(header) {
  const cheat = header.closest('.cheatsheet');
  cheat.classList.toggle('open');
  header.querySelector('span:last-child').textContent = cheat.classList.contains('open') ? '▼' : '▶';
}

function scrollToExtra() {
  document.getElementById('extra-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetAll() {
  if (confirm('確定要清除所有學習進度嗎？')) {
    state = {};
    saveState();
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
    updateUI();
  }
}

// ─── Init ───────────────────────────────────────────────────────────────────

loadState();
renderPhaseNav();
renderMain();
updateUI();
</script>
